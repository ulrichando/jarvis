name: security-audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 14:00 UTC — catches CVEs disclosed over the weekend
    - cron: '0 14 * * 1'

# Least-privilege default; jobs opt into more only if needed.
permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (voice-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Accepted (unfixable-in-place, non-exploitable in this runtime):
      # - PYSEC-2025-49 / CVE-2024-6345: setuptools install-time path traversal
      #   during `pip install`. Voice agent never invokes `pip install` at
      #   runtime, and the setuptools<82 pin is required for transitive
      #   `pkg_resources` consumers (numpy/onnxruntime/scipy/sklearn — setuptools
      #   82+ removed pkg_resources, which would break VAD/STT).
      # - PYSEC-2026-3447: setuptools MANIFEST.in exclusion bypass, ONLY on macOS
      #   APFS/HFS+ and ONLY while building an sdist. We run on Linux and never
      #   build sdists at runtime (setuptools present solely for pkg_resources).
      #   Its fix is 83.0.0, which removes pkg_resources → same <82 pin conflict.
      # - GHSA-xf7x-x43h-rpqh: json-repair DoS in SchemaRepairer.resolve_schema()
      #   via a circular-$ref JSON *schema*. Hard-pinned ==0.59.10 by
      #   livekit-agents (the framework); its usage is repairing LLM tool-call
      #   output strings (repair_json), not resolving attacker-supplied schemas,
      #   so the vulnerable path isn't reached. Clears when livekit-agents bumps.
      - run: pip-audit -r src/voice-agent/requirements.txt --strict --ignore-vuln PYSEC-2025-49 --ignore-vuln CVE-2024-6345 --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xf7x-x43h-rpqh

  npm-audit-cli:
    name: npm audit (cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      # Level=critical (not high) since 2026-06-11: the two remaining
      # HIGH findings are @opentelemetry/exporter-prometheus (+ sdk-node
      # depending on it) — GHSA-q7rr-3cgh-j5r3. The fix is a breaking
      # sdk-node 0.218 bump in a tree treated as a separate codebase,
      # and the exporter only listens when OTEL prometheus export is
      # explicitly enabled. Accepted + tracked in docs/decisions-pending.md;
      # restore --audit-level=high when the otel bump lands.
      - working-directory: src/cli
        run: npm audit --audit-level=critical

  npm-audit-web:
    name: npm audit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - working-directory: src/web
        # Temporarily --audit-level=critical (mirrors the cli job): the only high
        # is PostCSS GHSA-qx2v-qp2m-jg93 (XSS in CSS Stringify) — a build-time dev
        # dependency whose fix is a breaking major bump. Restore =high after the
        # next dependency bump lands.
        run: npm audit --audit-level=critical

  cargo-audit:
    name: cargo-audit (tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo install --locked cargo-audit
      - working-directory: src/voice-agent/desktop-tauri/src-tauri
        run: cargo audit
