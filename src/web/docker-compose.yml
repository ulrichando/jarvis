# JARVIS web — single-tenant enterprise stack.
#   caddy            → TLS termination + reverse proxy (Cloudflare in front of THIS)
#   web              → Next app + pty-server (non-root; talks to docker only via the proxy)
#   docker-proxy     → restricted Docker API (the web app's ONLY path to spawn sandboxes)
#   postgres         → app database
#
# Secrets come from ./.env.production (gitignored) — move to a real secrets
# manager for prod (see docs/runbook/deploy-online.md). DooD note: sandbox
# containers run on the HOST daemon, so the workspaces dir is bind-mounted at
# the SAME host path in `web` and passed as JARVIS_WORKSPACES_ROOT — the path
# must resolve identically for the app (file reads) and the daemon (-v mounts).

x-workspaces-root: &workspaces_root ${JARVIS_WORKSPACES_ROOT:-/srv/jarvis/workspaces}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Origin cert dir (Cloudflare Origin Certificate for Full (strict), or any
      # cert/key pair) → the Caddyfile loads /etc/caddy/certs/origin.{crt,key}.
      # Default ./certs (gitignored — never commit a key). For local/no-CF, drop
      # a self-signed pair here, or comment the `tls` line in the Caddyfile to
      # use Caddy's internal CA.
      - ${JARVIS_ORIGIN_CERT_DIR:-./certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [default, cu-net]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time → set your domain.
        NEXT_PUBLIC_PTY_URL: ${NEXT_PUBLIC_PTY_URL:-}
    restart: unless-stopped
    # default = the stack (postgres, docker-proxy, caddy, hub); jarvis-code-bridge
    # = the internal bridge /code workbench containers join to reach the git-proxy;
    # cu-net = the computer-use sandbox (:8771 SSE). One key — YAML rejects
    # duplicates (the 2026-07-06 deploy failed to parse on exactly that).
    networks: [default, jarvis-code-bridge, cu-net]
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      # Reach Docker ONLY through the restricted proxy — never the raw socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Must be a HOST path (the host daemon interprets the sandbox -v mounts).
      JARVIS_WORKSPACES_ROOT: *workspaces_root
      JARVIS_REQUIRE_LOCAL_AUTH: "1"
      JARVIS_SANDBOX_READONLY: "1"
      # pty-server binds 0.0.0.0 in-container so Caddy reaches it over the docker
      # network; it's NOT published to the host (only Caddy's /pty route fronts it).
      JARVIS_PTY_HOST: "0.0.0.0"
      # Require a per-session token on the PTY websocket (minted by
      # /api/workspace/[id]/pty-token, behind the app auth). Auto-on anyway for
      # the 0.0.0.0 bind above; set explicitly so a bind change can't silently
      # open an unauthenticated shell. Fails closed if the JWT secret is absent.
      JARVIS_PTY_REQUIRE_AUTH: "1"
      # In-network SearXNG for the chat web-search tool (the DuckDuckGo scraper
      # CAPTCHA-blocks the VPS IP → "Search unavailable"). Same host the CLI
      # proxy uses; unset in local dev falls back to the DDG scraper.
      SEARXNG_URL: "http://searxng:8080"
      # Cloud computer-use desktop (separate container on cu-net).
      JARVIS_COMPUTER_USE_WEB_URL: "http://computer-use:8771"
      JARVIS_CU_VNC_WS_URL: "${JARVIS_CU_VNC_WS_URL:-wss://0wlan.com/cu-vnc}"
      # Auth/host/DB come from .env.production:
      #   JARVIS_LOCAL_API_TOKEN, JARVIS_WEB_ALLOWED_HOSTS, BETTER_AUTH_URL,
      #   JARVIS_CANONICAL_HOST, DATABASE_URL, provider keys.
    volumes:
      # Same host path AND same in-container path → DooD bind-mount consistency
      # (the host daemon interprets the sandbox -v paths, so they must resolve
      # identically inside `web`).
      - ${JARVIS_WORKSPACES_ROOT:-/srv/jarvis/workspaces}:${JARVIS_WORKSPACES_ROOT:-/srv/jarvis/workspaces}
      # Persist ~/.jarvis across container rebuilds: connectors.json (the GitHub
      # connector), bridge.db (/code sessions + environments + git scopes),
      # mcp.json. Without this every `docker compose up --build web` — a routine
      # deploy — WIPES them (they otherwise live only in the container's
      # ephemeral layer), so the connector "disconnects" and /code sessions
      # vanish on every deploy.
      - jarvis_web_home:/home/jarvis/.jarvis
    depends_on:
      docker-proxy: { condition: service_started }
      postgres: { condition: service_healthy }
    expose: ["3000"]

  # Hub Gateway (JARVIS Hub sub-project 1): the CLI's :4000 proxy, holding the
  # provider keys + verifying login JWTs. Published on host 127.0.0.1:4000 so the
  # host's cloudflared tunnel (proxy.0wlan.com → localhost:4000) reaches it,
  # replacing the old jarvis-gateway binary. 127.0.0.1 only — never the public
  # interface; the tunnel + the JWT gate are the security layers. Keys +
  # JARVIS_PROXY_JWT_SECRET come from .env.production. Build context is ../cli.
  hub:
    build:
      context: ../cli
      dockerfile: Dockerfile.hub
    restart: unless-stopped
    # Also on jarvis-code-bridge so /code workbench containers reach the model
    # proxy by service name (hub:4000) when host.docker.internal is unreachable.
    networks: [default, jarvis-code-bridge]
    env_file:
      - path: .env.production
        required: false
    environment:
      JARVIS_PROXY_HOST: "0.0.0.0"
      JARVIS_ALLOW_PUBLIC_BIND: "1"
      JARVIS_PROXY_AUTH_REQUIRED: "1"
      JARVIS_PROXY_PORT: "4000"
      JARVIS_PROVIDER: "${JARVIS_PROVIDER:-deepseek}"
    expose: ["4000"]
    # Host-loopback publish so the host's cloudflared tunnel reaches this
    # container at proxy.0wlan.com → localhost:4000 (never the public interface).
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tecnativa socket-proxy: the web app can create/exec/manage CONTAINERS +
  # NETWORKS + IMAGES, but is denied host-level / privileged Docker ops. This is
  # the enterprise alternative to mounting /var/run/docker.sock into the app
  # (which would be host-root-equivalent).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      NETWORKS: "1"
      IMAGES: "1"
      POST: "1"
      # Everything else stays 0 (default deny): INFO, SWARM, NODES, SECRETS,
      # SYSTEM, etc. — no host-level reach.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["2375"]

  # SearXNG — self-hosted metasearch, JARVIS's credentialed-grade web_search
  # backend (keyless, aggregates ~20 engines, immune to the DuckDuckGo IP CAPTCHA
  # that blocks the local scraper). The voice-agent searxng plugin (local) reaches
  # it via Caddy at a hostname EXCLUDED from Cloudflare Access — same pattern as
  # /install.sh + /releases — and the web app can reach it in-network at
  # http://searxng:8080. settings.yml enables the JSON API (else 403). Point
  # SEARXNG_URL (voice-agent env / ~/.jarvis/keys.env) at the public hostname.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-https://searx.0wlan.com/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env.production}
    expose: ["8080"]

  # JARVIS GitHub App (gh.0wlan.com): @jarvis on an installed repo → GitHub
  # webhook → signature-verified intake → Postgres job queue → worker mints a
  # per-installation token and spawns a sandboxed jarvis container (via
  # docker-proxy, same restricted path as the /code sandboxes) that opens the
  # PR as the App. The public hostname is a cloudflared ingress EXCLUDED from
  # Cloudflare Access (GitHub can't do SSO; the HMAC signature is the auth).
  # Build context is the repo root — the image doubles as the SANDBOX image
  # (bin/ + src/cli inside; `image:` tags it on the host daemon so the worker
  # can spawn it by name). GH_APP_ID / GH_APP_PRIVATE_KEY /
  # GH_APP_WEBHOOK_SECRET / GH_APP_ALLOWLIST / DATABASE_URL / provider keys
  # come from .env.production (or /setup captures creds into gh_app_data).
  gh-app:
    build:
      context: ../..
      dockerfile: src/gh-app/Dockerfile
    image: jarvis-gh-app
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      GH_APP_PORT: "8790"
      GH_APP_BASE_URL: ${GH_APP_BASE_URL:-https://gh.0wlan.com}
      GH_APP_SANDBOX_IMAGE: ${GH_APP_SANDBOX_IMAGE:-jarvis-gh-app}
    volumes:
      - gh_app_data:/data
    depends_on:
      docker-proxy: { condition: service_started }
      postgres: { condition: service_healthy }
    expose: ["8790"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once on a fresh data dir — creates the `web` schema the drizzle
      # migrations target (they don't create it themselves). See the SQL header.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["5432"]

  # Cloud computer-use desktop — isolated Linux sandbox (Xvfb + WM + Firefox +
  # x11vnc + websockify + the JARVIS sidecar) that account-connected web users
  # drive from /computer-use. On cu-net ONLY: it reaches the internet + is
  # reached by web (:8771 SSE) and caddy (:6080 noVNC), but NOT docker-proxy /
  # postgres. Least-secrets: only provider keys + the VNC password (no env_file,
  # which would leak PG/JWT secrets into an internet-facing sandbox). Build
  # context is ../voice-agent.
  computer-use:
    build:
      context: ../voice-agent
      dockerfile: Dockerfile.computer-use
    restart: unless-stopped
    environment:
      DISPLAY: ":99"
      JARVIS_CU_WS_PORT: "6080"
      JARVIS_COMPUTER_USE_WEB_PORT: "8771"
      JARVIS_COMPUTER_USE_TIER: "${JARVIS_COMPUTER_USE_TIER:-full}"
      JARVIS_CU_VNC_PASSWORD: "${JARVIS_CU_VNC_PASSWORD:?set JARVIS_CU_VNC_PASSWORD in .env.production}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    networks: [cu-net]
    mem_limit: 2g
    shm_size: "512m"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8771", "6080"]

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  gh_app_data:
  # The web app's ~/.jarvis (connectors + /code bridge.db + mcp) — durable across
  # rebuilds/deploys. See the web service's volumes note.
  jarvis_web_home:

networks:
  default:
  # Cloud computer-use desktop's segment: web (:8771 SSE) + caddy (:6080 noVNC)
  # reach the sandbox; postgres/docker-proxy stay unreachable from it.
  cu-net:
    driver: bridge
  # Shared INTERNAL bridge: /code workbench containers join it at launch to
  # reach the web app (git-proxy + CCR callback) and the hub (model proxy) by
  # service name — the path that host.docker.internal can't serve here (web is
  # expose-only, hub binds host-loopback) and the public 0wlan.com can't (CF
  # bot-challenge). internal:true → no external egress via this net (session
  # egress stays squid-only); only web+hub+workbench attach, so postgres +
  # docker-proxy remain unreachable from session containers. containers.ts
  # connects the workbench with `docker network connect jarvis-code-bridge`.
  jarvis-code-bridge:
    name: jarvis-code-bridge
    internal: true
